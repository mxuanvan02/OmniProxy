services:
  omniproxy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/data/config.json
    # The image runs as uid:gid 65532. A bind-mounted ./data created before this
    # change is owned by the host user, which uid 65532 cannot write.
    # Either `sudo chown -R 65532:65532 ./data`, or run as your own account:
    #   UID=$(id -u) GID=$(id -g) docker compose up -d
    user: "${UID:-65532}:${GID:-65532}"
    healthcheck:
      # /health is unauthenticated by design, so no credentials are needed here.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
